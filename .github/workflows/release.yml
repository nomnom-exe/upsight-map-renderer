name: Renderer release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version and source
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`, 'Tag must match the package version.');
          assert.equal(lock.version, manifest.version, 'Lockfile version must match the package version.');
          assert.equal(lock.packages[''].version, manifest.version, 'Lockfile root version must match the package version.');
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Build and verify release archive
        run: npm run verify -- --archive-only --pack-destination "$RUNNER_TEMP/renderer-release"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-release
          path: ${{ runner.temp }}/renderer-release/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renderer-release
          path: ${{ runner.temp }}/renderer-release
      - name: Create GitHub release with verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          archives=("$RUNNER_TEMP"/renderer-release/*.tgz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            printf '%s\n' 'Expected one verified package archive.' >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          download_url="https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/$archive_name"
          printf 'Prebuilt renderer package.\n\n```sh\nnpm install %s\n```\n\n[Setup and API guide](https://github.com/%s/blob/%s/README.rst)\n' \
            "$download_url" "$RELEASE_REPOSITORY" "$RELEASE_TAG" > "$RUNNER_TEMP/renderer-release-notes.txt"
          gh release create "$RELEASE_TAG" "${archives[0]}" \
            --verify-tag \
            --repo "$RELEASE_REPOSITORY" \
            --title "Renderer $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/renderer-release-notes.txt"
